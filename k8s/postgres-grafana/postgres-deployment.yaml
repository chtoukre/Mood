apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-postgres
  template:
    metadata:
      labels:
        app: grafana-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: grafana
            - name: POSTGRES_USER
              value: grafana
            - name: POSTGRES_PASSWORD
              value: grafana_pass
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: grafana-postgres-pvc

